<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapids Adventure</title>
    <meta name="description"
      content="Get in touch with Rapids Adventure. Contact us today to book your next whitewater rafting trip, ask questions, or connect with our office team.">
    <meta name="author" content="Alex Franco Melgar Ruiz">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-crossedoars.jpeg" alt="Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-directory">
            <h1>White Water Rafting Company</h1>
            <address>
                <p>128 Saavedra</p>
                <p>Argentina Buenos Aires</p>
                <p><a href="tel:+19999999999">+54 1171446029</a></p>
                <p><a href="mailto:info@whitewater.com">rafting@about.com</a></p>
            </address>
        </section>

        <div class="contact-grid">

            <section class="map-box">
                <iframe src="https://google.com" width="100%" height="450" allowfullscreen=""
                  loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>

            <section class="form-box">
                <form action="#" method="post" class="contact-form">

                    <div class="form-group">
                        <label for="user-name">Name</label>
                        <input type="text" id="user-name" name="user-name" placeholder="Alex Melgar"
                          required>
                    </div>

                    <div class="form-group">
                        <label for="user-email">Email</label>
                        <input type="email" id="user-email" name="user-email"
                          placeholder="your_email@gmail.com" required>
                    </div>

                    <fieldset class="radio-group">
                        <legend>Message Purpose</legend>
                        <label>
                            <input type="radio" name="purpose" value="general" checked> General
                            Inquiry
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="reservation"> Reservation
                            Question
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="suggestion"> Website
                            Suggestion
                        </label>
                    </fieldset>

                    <div class="form-group">
                        <label for="user-message">Message</label>
                        <textarea id="user-message" name="user-message" rows="5"
                          placeholder="Type here" required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" name="newsletter" value="subscribe" checked>
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit" class="btn-submit">Subscribe</button>

                </form>
            </section>
        </div>
    </main>

    <footer>
        <p> &copy; 2026 ☻ Rapids ☻ Alex Melgar </p>
        <nav class="socialmedia">
            <a href="https://instagram.com">
                <img src="images/instagram_icon.png" alt="instagram_icon">
            </a>
            <a href="https://facebook.com">
                <img src="images/facebook_logo.png" alt="facebook_logo">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.png" alt="youtube_icon">
            </a>
        </nav>
    </footer>

</body>

</html>
